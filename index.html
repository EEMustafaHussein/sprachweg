<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>درب الألمانية | Sprachweg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060914;--bg2:#0d1226;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.07);--line:rgba(255,255,255,.1);--txt:#eef0ff;--mut:#9ba3c7;
  --vio:#7c5cff;--pink:#ff5c8a;--yel:#ffc54d;--cyan:#3ee0cf;--red:#ff5c6c;--grn:#2ee59d;--blue:#4d7cff;--gold:#ffc54d;--green:#2ee59d;
  --ink:rgba(255,255,255,.14);--paper:#060914;
  --grad:linear-gradient(120deg,#7c5cff,#ff5c8a 55%,#ffc54d);
  --r:20px;--sh:0 20px 50px -20px rgba(0,0,0,.7);--bd:1px solid var(--line);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--txt);overflow-x:hidden;line-height:1.75;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:'Alexandria','IBM Plex Sans Arabic',sans-serif;font-weight:800;letter-spacing:-.3px}
.de{font-family:'Outfit','IBM Plex Sans Arabic',sans-serif;direction:ltr;unicode-bidi:isolate;display:inline-block}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% auto;animation:gshift 6s linear infinite}
@keyframes gshift{to{background-position:200% center}}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
input,textarea,select{font-family:inherit;font-size:1rem;color:var(--txt);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:12px 15px;width:100%;outline:none;transition:.2s}
input:focus,textarea:focus,select:focus{border-color:var(--vio);box-shadow:0 0 0 4px rgba(124,92,255,.2);background:rgba(255,255,255,.07)}
select option{background:#151a33}
a{color:#b9a8ff}
::selection{background:var(--vio);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#2a3157;border-radius:9px}
/* aurora */
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bgfx .au{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;mix-blend-mode:screen;animation:au 22s ease-in-out infinite}
#bgfx .a1{width:55vw;height:55vw;background:#5b3cff;top:-25vw;right:-15vw}
#bgfx .a2{width:45vw;height:45vw;background:#ff3d7f;bottom:-25vw;left:-10vw;animation-delay:-7s;opacity:.32}
#bgfx .a3{width:35vw;height:35vw;background:#1fc8b4;top:35%;left:30%;animation-delay:-14s;opacity:.18}
#bgfx .grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 75%)}
#bgfx .star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
@keyframes au{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(6vw,-4vw) scale(1.15)}66%{transform:translate(-5vw,5vw) scale(.9)}}
/* splash */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .7s,transform .7s}
#splash.hide{opacity:0;transform:scale(1.08);pointer-events:none}
.logo3{width:84px;height:84px;border-radius:26px;background:var(--grad);display:grid;place-items:center;font-family:'Outfit';font-weight:800;font-size:2.3rem;color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.2) inset,0 20px 60px -10px rgba(124,92,255,.8);animation:lg 1.2s cubic-bezier(.3,1.5,.5,1) both;position:relative}
.logo3::after{content:'';position:absolute;inset:-10px;border-radius:32px;border:2px solid rgba(124,92,255,.5);animation:ring 1.6s ease-out infinite}
@keyframes lg{from{transform:scale(0) rotate(-120deg)}}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.5);opacity:0}}
.logo-t{font-family:'Alexandria';font-size:2.1rem;font-weight:800;animation:up .7s .35s both}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.loader{width:170px;height:4px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;animation:up .6s .5s both}
.loader i{display:block;height:100%;width:0;background:var(--grad);animation:load 1.3s .5s cubic-bezier(.6,0,.2,1) forwards}
@keyframes load{to{width:100%}}
#app{position:relative;z-index:1;min-height:100%}
/* ---------- landing ---------- */
.lnav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px 5vw;backdrop-filter:blur(16px);background:rgba(6,9,20,.55);border-bottom:1px solid rgba(255,255,255,.06)}
.lnav .lk{color:var(--mut);text-decoration:none;font-weight:500;font-size:.95rem;transition:.2s}.lnav .lk:hover{color:#fff}
.brand-l{display:flex;align-items:center;gap:10px;font-family:'Alexandria';font-weight:800;font-size:1.2rem;margin-left:auto}
.lg-s{width:36px;height:36px;border-radius:11px;background:var(--grad);display:grid;place-items:center;font-family:'Outfit';font-weight:800;color:#fff;font-size:1.1rem;flex-shrink:0}
.lhero{min-height:calc(100vh - 66px);display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:40px;padding:40px 5vw 60px;position:relative}
.lhero h1{font-size:clamp(2.3rem,5vw,4.2rem);line-height:1.15;font-weight:900;margin:14px 0 18px}
.lhero p{color:var(--mut);font-size:1.15rem;max-width:560px}
.chip-hi{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;background:rgba(124,92,255,.12);border:1px solid rgba(124,92,255,.35);font-size:.88rem;color:#cfc4ff}
.chip-hi i{width:8px;height:8px;border-radius:50%;background:var(--grn);box-shadow:0 0 10px var(--grn);animation:tw 1.6s infinite}
.orbit{position:relative;width:min(460px,90vw);aspect-ratio:1;margin:auto}
.orbit .core{position:absolute;inset:28%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9d86ff,#5b3cff 45%,#2a1680);box-shadow:0 0 120px rgba(124,92,255,.6),inset -20px -30px 60px rgba(0,0,0,.4);display:grid;place-items:center;font-family:'Outfit';font-weight:800;font-size:2.6rem;color:#fff;animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05)}}
.orbit .orb{position:absolute;inset:0;border:1px dashed rgba(255,255,255,.12);border-radius:50%;animation:spin 40s linear infinite}
.orbit .orb.r2{inset:12%;animation-duration:28s;animation-direction:reverse}
.orbit .ow{position:absolute;padding:7px 14px;border-radius:12px;background:rgba(20,24,48,.85);border:1px solid var(--line);font-family:'Outfit';font-weight:600;white-space:nowrap;backdrop-filter:blur(8px);box-shadow:var(--sh);animation:counter 40s linear infinite}
.orbit .orb.r2 .ow{animation-duration:28s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes counter{to{transform:rotate(-360deg)}}
.orbit .ow small{display:block;font-family:'IBM Plex Sans Arabic';color:var(--mut);font-size:.72rem;font-weight:400}
.lsec{padding:80px 5vw;position:relative}
.lsec>h2{font-size:clamp(1.8rem,3.5vw,2.7rem);text-align:center;margin-bottom:10px}
.lsec>.sub{text-align:center;color:var(--mut);max-width:620px;margin:0 auto 46px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:1000px;margin:0 auto}
.stat{text-align:center;padding:24px 10px}
.stat b{display:block;font-family:'Outfit';font-size:2.6rem;font-weight:800}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:1100px;margin:0 auto;counter-reset:st}
.steps .card{counter-increment:st;padding:28px}
.steps .card::after{content:counter(st);position:absolute;top:16px;left:20px;font-family:'Outfit';font-size:3.5rem;font-weight:800;color:rgba(255,255,255,.06)}
.lvline{display:flex;gap:0;max-width:1000px;margin:0 auto;position:relative;justify-content:space-between}
.lvline::before{content:'';position:absolute;top:34px;right:5%;left:5%;height:3px;background:var(--grad);border-radius:3px;opacity:.6}
.lvdot{text-align:center;flex:1;position:relative}
.lvdot b{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;background:var(--bg2);border:2px solid var(--c);font-family:'Outfit';font-size:1.3rem;box-shadow:0 0 30px -5px var(--c);transition:.3s}
.lvdot:hover b{transform:scale(1.12);background:var(--c)}
.about{max-width:900px;margin:0 auto;display:grid;grid-template-columns:200px 1fr;gap:30px;align-items:center;padding:34px}
.avatar{width:180px;height:180px;border-radius:50%;background:var(--grad);padding:4px;position:relative}
.avatar>div{width:100%;height:100%;border-radius:50%;background:#141938;display:grid;place-items:center;font-family:'Alexandria';font-size:3.4rem;font-weight:800}
.avatar::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px dashed rgba(255,255,255,.18);animation:spin 18s linear infinite}
.socials{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.soc{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt);text-decoration:none;font-weight:600;transition:.2s}
.soc:hover{transform:translateY(-3px);border-color:var(--c,var(--vio));box-shadow:0 10px 30px -10px var(--c,var(--vio))}
.soc svg{width:18px;height:18px;fill:currentColor}
.lfoot{padding:30px 5vw;border-top:1px solid rgba(255,255,255,.06);display:flex;gap:16px;flex-wrap:wrap;align-items:center;color:var(--mut);font-size:.9rem}
.reveal{opacity:0;transform:translateY(40px);transition:opacity .9s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}
/* auth modal */
.auth-wrap{display:contents}
.panel{background:rgba(16,20,42,.92);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:26px;padding:30px;width:100%;max-width:440px;box-shadow:0 40px 100px -20px rgba(0,0,0,.8),0 0 0 1px rgba(124,92,255,.15);animation:pop .5s cubic-bezier(.2,1.3,.4,1);position:relative;text-align:right}
.tabs{display:flex;background:rgba(255,255,255,.05);border-radius:14px;padding:4px;margin-bottom:20px}
.tabs button{flex:1;padding:10px;border-radius:11px;font-weight:600;color:var(--mut);transition:.25s}
.tabs button.on{color:#fff;background:var(--grad);box-shadow:0 6px 20px -6px rgba(255,92,138,.7)}
.fld{margin-bottom:13px;position:relative}
.fld label{display:block;font-size:.84rem;color:var(--mut);margin-bottom:5px}
.eye{position:absolute;left:10px;bottom:10px;padding:4px 6px;font-size:.78rem;color:var(--mut)}
.str{height:4px;border-radius:9px;background:rgba(255,255,255,.08);margin-top:8px;overflow:hidden}.str i{display:block;height:100%;transition:.3s}
.otp{display:flex;gap:10px;justify-content:center;direction:ltr;margin:18px 0}
.otp input{width:52px;height:60px;text-align:center;font-size:1.6rem;font-family:'Outfit';font-weight:700;padding:0}
.row{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:14px;font-weight:600;font-size:1rem;transition:transform .2s,box-shadow .25s,background .25s;position:relative;overflow:hidden;text-decoration:none;color:var(--txt);background:rgba(255,255,255,.06);border:1px solid var(--line)}
.btn:hover:not(:disabled){transform:translateY(-2px);background:rgba(255,255,255,.1)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.p{background:var(--grad);background-size:200% auto;color:#fff;border:none;box-shadow:0 10px 30px -10px rgba(255,92,138,.8);animation:gshift 6s linear infinite}
.btn.p:hover:not(:disabled){box-shadow:0 14px 40px -8px rgba(255,92,138,.9);background:var(--grad);background-size:200% auto}
.btn.s{background:rgba(255,255,255,.06)}
.btn.g{background:linear-gradient(120deg,#16c784,#2ee59d);color:#04231a;border:none}
.btn.r{background:linear-gradient(120deg,#ff3d5a,#ff5c8a);color:#fff;border:none}
.btn.b{background:linear-gradient(120deg,#5b3cff,#7c5cff);color:#fff;border:none;box-shadow:0 10px 30px -10px rgba(124,92,255,.9)}
.btn.w{width:100%}
.btn.lg{padding:15px 30px;font-size:1.08rem;border-radius:16px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .6s}
.btn.p:hover::after,.btn.b:hover::after{left:120%}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rip .6s linear;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.note{font-size:.84rem;color:var(--mut);background:rgba(124,92,255,.07);border:1px solid rgba(124,92,255,.22);border-radius:14px;padding:11px 14px;margin-top:14px}
.err{color:#ff8a9b;font-size:.9rem;min-height:1.4em;margin:6px 0}
.chk{display:flex;align-items:center;gap:8px;font-size:.92rem;color:var(--mut);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--vio)}
/* shell */
.shell{display:grid;grid-template-columns:262px 1fr;min-height:100vh}
.side{background:rgba(10,13,30,.7);backdrop-filter:blur(20px);border-left:1px solid rgba(255,255,255,.06);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px;font-family:'Alexandria';font-weight:800;font-size:1.2rem}
.mini-flag{display:none}
.nav{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;color:var(--mut);font-weight:500;transition:.2s;text-align:right;width:100%;position:relative}
.nav svg{width:20px;height:20px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:.2s}
.nav:hover{color:#fff;background:rgba(255,255,255,.04)}
.nav:hover svg{transform:scale(1.15)}
.nav.on{color:#fff;background:linear-gradient(90deg,rgba(124,92,255,.05),rgba(124,92,255,.22));}
.nav.on::before{content:'';position:absolute;right:-14px;top:20%;bottom:20%;width:3px;border-radius:3px;background:var(--grad);box-shadow:0 0 12px var(--vio)}
.nav.on svg{stroke:#b9a8ff}
.nav .bd{margin-right:auto;background:var(--pink);color:#fff;font-size:.7rem;border-radius:9px;padding:0 7px;font-weight:700}
.nav-h{font-size:.7rem;color:#5e6690;padding:14px 14px 4px;letter-spacing:.5px}
.main{padding:26px 34px 100px;max-width:1180px;width:100%;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.top h2{font-size:1.9rem;font-weight:800;margin-left:auto}
.pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);border:1px solid var(--line);padding:5px 14px;border-radius:99px;font-weight:600;font-size:.9rem}
.pill.f{color:#ffab5c}.pill.x{color:var(--yel)}
.view{animation:enter .5s cubic-bezier(.2,.8,.2,1)}
.view>*{animation:enter .6s cubic-bezier(.2,.8,.2,1) backwards}
.view>*:nth-child(2){animation-delay:.06s}.view>*:nth-child(3){animation-delay:.12s}.view>*:nth-child(4){animation-delay:.18s}.view>*:nth-child(5){animation-delay:.24s}.view>*:nth-child(6){animation-delay:.3s}
@keyframes enter{from{opacity:0;transform:translateY(24px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .35s;position:relative;overflow:hidden;backdrop-filter:blur(10px)}
.card::before{content:'';position:absolute;inset:0;background:radial-gradient(400px circle at var(--mx,50%) var(--my,-100%),rgba(124,92,255,.16),transparent 45%);pointer-events:none;transition:opacity .3s}
.card.h{cursor:pointer}
.card.h:hover{transform:translateY(-6px);border-color:rgba(124,92,255,.45);box-shadow:0 30px 60px -25px rgba(124,92,255,.55)}
.card h3{font-size:1.15rem;margin-bottom:4px}
.mut{color:var(--mut)}.sm{font-size:.86rem}
.big-ic{width:56px;height:56px;display:grid;place-items:center;font-size:1.7rem;border-radius:16px;margin-bottom:14px;transition:transform .4s cubic-bezier(.3,1.6,.5,1);background:linear-gradient(135deg,rgba(124,92,255,.25),rgba(255,92,138,.15));border:1px solid rgba(255,255,255,.1)}
.card.h:nth-child(4n+2) .big-ic{background:linear-gradient(135deg,rgba(62,224,207,.22),rgba(77,124,255,.15))}
.card.h:nth-child(4n+3) .big-ic{background:linear-gradient(135deg,rgba(255,197,77,.25),rgba(255,92,138,.12))}
.card.h:nth-child(4n+4) .big-ic{background:linear-gradient(135deg,rgba(46,229,157,.22),rgba(62,224,207,.1))}
.card.h:hover .big-ic{transform:translateY(-4px) rotate(-8deg) scale(1.08)}
.hero{background:linear-gradient(130deg,rgba(124,92,255,.35),rgba(255,92,138,.18) 60%,rgba(255,197,77,.12));padding:28px;display:flex;gap:26px;align-items:center;flex-wrap:wrap;border-color:rgba(124,92,255,.35)}
.hero::after{content:'';position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%);left:-80px;top:-120px;animation:au 14s infinite}
.hero>*{position:relative;z-index:1}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(from 0deg,#7c5cff,#ff5c8a calc(var(--p)*.6%),#ffc54d calc(var(--p)*1%),rgba(255,255,255,.08) 0);display:grid;place-items:center;flex-shrink:0;box-shadow:0 0 40px -10px rgba(124,92,255,.8)}
.ring>div{width:96px;height:96px;border-radius:50%;background:#12163a;display:grid;place-items:center;text-align:center;font-weight:800;line-height:1.15}
.bar{height:12px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.bar i::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 2s infinite;transform:translateX(-100%)}
@keyframes shine{to{transform:translateX(100%)}}
.tag{display:inline-block;font-size:.74rem;padding:2px 10px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:600}
.lv-A1{--c:#2ee59d}.lv-A2{--c:#4d7cff}.lv-B1{--c:#9c7cff}.lv-B2{--c:#ffab5c}.lv-C1{--c:#ff5c8a}
.say{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#5b3cff,#7c5cff);color:#fff;font-size:.9rem;transition:.2s;flex-shrink:0;vertical-align:middle;box-shadow:0 6px 20px -6px rgba(124,92,255,.9)}
.say:hover{transform:scale(1.12)}.say.playing{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(124,92,255,.7)}100%{box-shadow:0 0 0 16px rgba(124,92,255,0)}}
.marq{overflow:hidden;margin:0 0 22px;padding:10px 0;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.marq div{display:inline-block;animation:marq 50s linear infinite;font-family:'Outfit';font-weight:500;color:var(--mut)}
.marq span{margin:0 8px;padding:5px 14px;border-radius:99px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(50%)}}
/* path */
.lvtabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.lvtab{padding:9px 18px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-weight:600;font-family:'Outfit';transition:.2s}
.lvtab:hover{border-color:var(--c,var(--vio))}

async function hash(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sw::'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const c of 'sw::'+p)h=(h*31+c.charCodeAt(0))|0;return 'f'+h}}

function speak(t,btn,rate){
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=rate||(U()&&U().rate)||0.9;
    const v=voices.find(v=>/google|anna|katja|helena/i.test(v.name))||voices[0];if(v)u.voice=v;

}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen(cb,err){
  if(!SR){err('no');return null}
  try{const r=new SR();r.lang='de-DE';r.interimResults=false;r.maxAlternatives=3;
    r.onresult=e=>cb([...e.results[0]].map(a=>a.transcript));r.onerror=e=>err(e.error);r.start();return r}catch(e){err('no');return null}
}
function similarity(a,b){a=norm(a);b=norm(b);const m=a.length,n=b.length;if(!m||!n)return 0;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return Math.round(100*(1-d[m][n]/Math.max(m,n)))}

const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],cfRun=false;
function confetti(n=140){cv.width=innerWidth;cv.height=innerHeight;const cols=['#ffcc00','#e8333a','#22c55e','#4f7cff','#9b5cff','#fff'];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,s:Math.random()*8+4,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.3,l:120});
  if(!cfRun){cfRun=true;requestAnimationFrame(cfLoop)}}
function cfLoop(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.vx*=.99;p.r+=p.vr;p.l--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});
  parts=parts.filter(p=>p.l>0&&p.y<cv.height+20);if(parts.length)requestAnimationFrame(cfLoop);else{cfRun=false;cx.clearRect(0,0,cv.width,cv.height)}}
function xpPop(n,x,y){const d=document.createElement('div');d.className='xp-pop';d.textContent='+'+n+' XP';d.style.left=(x||innerWidth/2-50)+'px';d.style.top=(y||innerHeight/2)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1200)}

function addXP(n,ev){const u=U();const before=rankOf(u.xp);u.xp+=n;const d=today();u.dayXP[d]=(u.dayXP[d]||0)+n;

function checkBadges(){const u=U(),s=u.stats,n=Object.keys(u.srs).length;

function srsAdd(de){const u=U();if(!u.srs[de])u.srs[de]={ef:2.5,int:0,reps:0,due:Date.now()+864e5}}
function srsGrade(de,q){const u=U();const c=u.srs[de]||(u.srs[de]={ef:2.5,int:0,reps:0,due:0});
  if(q<3){c.reps=0;c.int=0;c.due=Date.now()+10*60e3}else{c.reps++;c.int=c.reps===1?1:c.reps===2?3:Math.round(c.int*c.ef*(q===5?1.3:q===3?0.8:1));c.due=Date.now()+c.int*864e5}

function artHint(de){const m=de.match(/^(der|die|das) /);if(!m)return'';const c={der:'#2f6bff',die:'#e8335f',das:'#20b26b'}[m[1]];return `<div style="margin-top:6px"><span class="tag" style="background:${c};border:none">${m[1]} = ${{der:'مذكر',die:'مؤنث',das:'محايد'}[m[1]]}</span></div>`}
function buildEx(x,mode){const pool=wordsOf(x.L);const ex=[];const W=x.w.map(w=>({de:w[0],ar:w[1],ex:w[2]}));
  const dis=(ans,key,n=3)=>pick([...new Set(pool.map(p=>p[key]).filter(v=>v!==ans))],n);
  W.forEach((w,k)=>{const t=mode==='quiz'?Math.random()*4|0:k%4;
    if(t===0)ex.push({type:'mc',q:'ما معنى هذه الكلمة؟',big:w.de,say:w.de,opts:shuf([w.ar,...dis(w.ar,'ar')]),a:w.ar,w:w.de});
    else if(t===1)ex.push({type:'mc',q:'🎧 استمع واختر ما سمعته',listen:w.de,opts:shuf([w.de,...dis(w.de,'de')]),a:w.de,de:true,w:w.de});

    else ex.push({type:'type',q:`اكتب بالألمانية: "${w.ar}"`,a:w.de,say:w.de,w:w.de})});
  x.s.forEach(s=>{const others=pick(allUnits().flatMap(u=>u.s).filter(o=>o[0]!==s[0]).flatMap(o=>o[0].replace(/[.,!?]/g,'').split(' ')),2);ex.push({type:'build',q:'رتّب الجملة: '+s[1],a:s[0],toks:shuf([...s[0].replace(/[.,!?]/g,'').split(' '),...others])})});
  if(x.g)x.g.q.forEach(g=>ex.push({type:'mc',q:'📐 '+x.g.t,big:g[0],opts:g[1],a:g[1][g[2]],de:true}));
  return mode==='quiz'?shuf(ex):ex}

  const gain=10+Math.round(acc*20)+(res.mist===0?10:0);saveDB();

/* ===================== AI ASSISTANT "مصطفى" ===================== */
/* ضع مفتاح Gemini هنا (من aistudio.google.com) وقيّده باسم موقعك من Google Cloud حتى ما يستخدمه غيرك */
const SITE_AI_KEY=SITE.aiKey;
const AI_MODELS=['gemini-2.5-flash','gemini-2.0-flash','gemini-1.5-flash'];
const aiKey=()=>(U()&&U().aiKey)||DB.aiKey||SITE_AI_KEY;
let aiHist=[];
function aiSys(){const u=U();return `أنت "مصطفى"، مدرّس لغة ألمانية ودود ومرح داخل موقع "درب الألمانية". تكلّم بالعربي بلهجة عراقية خفيفة ومفهومة، واكتب الأمثلة الألمانية بين علامتي « ». المتعلم اسمه ${u.name} ومستواه ${curLevel()}.
قواعدك: اجعل الإجابات قصيرة وواضحة (أقل من 150 كلمة إلا إذا طُلب شرح). إذا كتب جملة ألمانية، صحّحها أولاً واشرح الخطأ ببساطة. اعطِ مثالين كحد أقصى. شجّعه دائماً. إذا طلب محادثة، تكلّم بالألمانية بمستواه وضع الترجمة العربية تحت كل جملة. لا تخرج عن تعلم الألمانية والحياة في ألمانيا إلا بلطف.`}
async function aiAsk(q){const key=aiKey();if(!key)return aiOffline(q);
 aiHist.push({role:'user',parts:[{text:q}]});const body={systemInstruction:{parts:[{text:aiSys()}]},contents:aiHist.slice(-12),generationConfig:{temperature:.7,maxOutputTokens:700}};let last='';
 for(const m of AI_MODELS){try{const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
   const j=await r.json();if(r.ok){const t=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts||[]).map(p=>p.text||'').join('').trim()||'ما گدرت أجاوب، جرّب تسأل بطريقة ثانية.';aiHist.push({role:'model',parts:[{text:t}]});return t}
   last=(j.error&&j.error.message)||r.status;if(r.status===400&&/API key/i.test(last))break;if(r.status===429)break}catch(e){last=e.message}}
 aiHist.pop();return `⚠️ ما گدرت أتصل بالذكاء الاصطناعي (${esc(String(last)).slice(0,120)}). إذا المشكلة بالمفتاح راجع لوحة المالك، وإذا "quota" فالحد المجاني اليومي خلص، جرّب بعدين.`}
function aiOffline(q){const all=allWords();const t=q.trim();const f=all.filter(w=>norm(w.de).includes(norm(t))||w.ar.includes(t)).slice(0,5);
 if(f.length&&t.length>1)return `لگيت بالقاموس:\n${f.map(w=>`• «${w.de}» = ${w.ar}${w.ex?`\n  مثال: «${w.ex}»`:''}`).join('\n')}`;
 return `هلا ${U().name}! 👋 آني مصطفى، مساعدك.\nحالياً أشتغل بوضع محدود: أگدر أترجملك أي كلمة من قاموس الموقع (اكتب الكلمة بالعربي أو الألماني).\nحتى أصير مساعد ذكي كامل (أصحح جملك وأسولف وياك بالألماني) لازم مالك الموقع يضيف مفتاح Gemini المجاني.`}
function aiFmt(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/«([^»]+)»/g,(m,g)=>`<span class="de" style="background:rgba(255,197,77,.16);color:#ffd98a;border-radius:4px;padding:0 4px;cursor:pointer" data-say="${g}">${g}</span>`).replace(/\n/g,'<br>')}
function assistant(){const u=U();const has=!!aiKey();
 $('#v').innerHTML=`<div class="card" style="padding:0;overflow:hidden;max-width:820px;margin:0 auto">
  <div class="row" style="padding:14px 18px;border-bottom:var(--bd);background:linear-gradient(120deg,rgba(124,92,255,.35),rgba(255,92,138,.2))"><div style="width:52px;height:52px;border-radius:50%;background:var(--blue);border:var(--bd);display:grid;place-items:center;color:#fff;font-family:Alexandria;font-weight:900;font-size:1.4rem;position:relative">م<span style="position:absolute;bottom:0;left:0;width:14px;height:14px;border-radius:50%;background:${has?'var(--grn)':'#aaa'};border:2px solid var(--ink)"></span></div>
   <div><b class="disp" style="font-size:1.2rem">المساعد مصطفى</b><div class="sm">${has?'مدرّسك الذكي، مدعوم بـ Gemini':'وضع القاموس، الذكاء غير مفعّل بعد'}</div></div><button class="btn s" style="margin-right:auto;padding:6px 12px" onclick="aiHist=[];assistant()">محادثة جديدة</button></div>
  <div id="chat" style="height:min(56vh,520px);overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--card2)"></div>
  <div style="padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap">${['صحّح جملتي: Ich habe gestern nach Berlin gefahren','اشرحلي الفرق بين der و die و das','سولف وياي بالألماني عن الشغل','اعطني 5 كلمات عن المطبخ','شلون أحضّر لامتحان Goethe A1؟'].map(c=>`<button class="chip" style="font-family:IBM Plex Sans Arabic" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  <form id="af2" class="row" style="padding:12px 14px;border-top:var(--bd)"><input id="aq" placeholder="اكتب سؤالك أو جملة بالألماني..." autocomplete="off"><button class="btn p">إرسال</button></form></div>
  ${has?'':`<div class="note" style="max-width:820px;margin:16px auto">لتفعيل الذكاء الكامل: المالك يضيف مفتاح Gemini من <b>لوحة المالك</b>، أو تگدر تضيف مفتاحك الشخصي من صفحة <b>ملفي</b>.</div>`}`;
 const chat=$('#chat');const add=(who,html)=>{const d=document.createElement('div');d.style.cssText=`max-width:82%;padding:10px 14px;border:2px solid var(--ink);border-radius:14px;line-height:1.9;animation:pop .3s;box-shadow:var(--sh);${who==='me'?'align-self:flex-start;background:var(--blue);color:#fff':'align-self:flex-end;background:rgba(255,255,255,.07)'}`;d.innerHTML=html;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d};
 if(!aiHist.length)add('ai',aiFmt(`هلا وغلا ${u.name}! 😄 آني مصطفى، مساعدك بتعلم الألماني.\nاسألني أي شي: معنى كلمة، قاعدة، أو اكتبلي جملة وأصححها. واضغط على أي جملة ألمانية بين « » حتى تسمعها.`));
 else aiHist.forEach(h=>add(h.role==='user'?'me':'ai',h.role==='user'?esc(h.parts[0].text):aiFmt(h.parts[0].text)));
 const send=async q=>{if(!q.trim())return;add('me',esc(q));$('#aq').value='';const t=add('ai','<span class="typing">مصطفى يكتب<span>.</span><span>.</span><span>.</span></span>');const a=await aiAsk(q);t.innerHTML=aiFmt(a);chat.scrollTop=chat.scrollHeight;const u=U();u.stats.ai=(u.stats.ai||0)+1;if(u.stats.ai===1)addXP(5);saveDB()};
 $('#af2').onsubmit=e=>{e.preventDefault();send($('#aq').value)};document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>send(b.dataset.c));$('#aq').focus()}

document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.card');if(c){const R=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-R.left)+'px');c.style.setProperty('--my',(e.clientY-R.top)+'px')}});
(function(){const f=$('#bgfx');for(let i=0;i<40;i++){const s=document.createElement('i');s.className='star';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${-Math.random()*3}s;opacity:${.2+Math.random()*.6}`;f.appendChild(s)}})();
