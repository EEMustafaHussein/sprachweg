<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>درب الألمانية | Sprachweg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1020;--bg2:#121933;--card:#171f3d;--card2:#1e2850;--line:#2a3566;
  --txt:#eef1ff;--mut:#9aa4d0;--gold:#ffcc00;--red:#e8333a;--green:#22c55e;--blue:#4f7cff;--purple:#9b5cff;
  --r:18px;--sh:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--txt);overflow-x:hidden;line-height:1.7}
.de{font-family:'Inter','Cairo',sans-serif;direction:ltr;unicode-bidi:isolate;display:inline-block}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
input,textarea,select{font-family:inherit;font-size:1rem;color:var(--txt);background:var(--bg2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none;transition:.2s}
input:focus,textarea:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,204,0,.12)}
a{color:var(--gold)}
/* background */
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;animation:float 18s ease-in-out infinite}
.blob.b1{width:420px;height:420px;background:#e8333a;top:-120px;right:-100px}
.blob.b2{width:380px;height:380px;background:#ffcc00;bottom:-140px;left:-80px;animation-delay:-6s;opacity:.22}
.blob.b3{width:300px;height:300px;background:#4f7cff;top:40%;left:40%;animation-delay:-12s;opacity:.25}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.1)}66%{transform:translate(-30px,40px) scale(.95)}}
.fl{position:absolute;font-family:Inter;font-weight:800;color:rgba(255,255,255,.06);animation:rise linear infinite;bottom:-60px}
@keyframes rise{to{transform:translateY(-120vh) rotate(360deg)}}
/* splash */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .6s}
#splash.hide{opacity:0;pointer-events:none}
.flag{display:flex;flex-direction:column;width:110px;height:72px;border-radius:12px;overflow:hidden;box-shadow:var(--sh);animation:wave 1.6s ease-in-out infinite}
.flag i{flex:1;transform-origin:right;animation:draw .7s ease forwards;transform:scaleX(0)}
.flag i:nth-child(1){background:#111;animation-delay:.1s}.flag i:nth-child(2){background:var(--red);animation-delay:.3s}.flag i:nth-child(3){background:var(--gold);animation-delay:.5s}
@keyframes draw{to{transform:scaleX(1)}}
@keyframes wave{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-6px)}}
.logo-t{font-size:2.2rem;font-weight:900;letter-spacing:.5px}
.logo-t b{color:var(--gold)}
.loader{width:160px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.loader i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));animation:load 1.4s ease forwards}
@keyframes load{to{width:100%}}
/* layout */
#app{position:relative;z-index:1;min-height:100%}
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;gap:0}
.auth-hero{padding:56px;display:flex;flex-direction:column;justify-content:center;gap:22px}
.auth-hero h1{font-size:2.6rem;line-height:1.3;font-weight:900}
.auth-hero h1 span{background:linear-gradient(90deg,var(--gold),var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.feat div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px 14px;animation:pop .5s backwards}
.auth-box{display:flex;align-items:center;justify-content:center;padding:30px}
.panel{background:rgba(23,31,61,.85);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;padding:30px;width:100%;max-width:440px;box-shadow:var(--sh);animation:pop .6s}
.tabs{display:flex;background:var(--bg2);border-radius:14px;padding:5px;margin-bottom:20px;position:relative}
.tabs button{flex:1;padding:10px;border-radius:10px;font-weight:700;color:var(--mut);transition:.25s;position:relative;z-index:1}
.tabs button.on{color:#111;background:var(--gold)}
.fld{margin-bottom:12px;position:relative}
.fld label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:4px}
.eye{position:absolute;left:10px;bottom:9px;padding:4px 6px;font-size:1.1rem;opacity:.7}
.str{height:5px;border-radius:9px;background:var(--line);margin-top:6px;overflow:hidden}.str i{display:block;height:100%;transition:.3s}
.row{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:14px;font-weight:700;font-size:1rem;transition:transform .15s,box-shadow .2s,filter .2s;position:relative;overflow:hidden}
.btn:active{transform:scale(.96)}
.btn.p{background:linear-gradient(135deg,var(--gold),#ff9d00);color:#1a1300;box-shadow:0 6px 0 #b37000}
.btn.p:active{box-shadow:0 2px 0 #b37000;transform:translateY(4px)}
.btn.s{background:var(--card2);border:1.5px solid var(--line)}
.btn.g{background:var(--green);color:#04230f;box-shadow:0 6px 0 #138a3f}
.btn.r{background:var(--red);color:#fff;box-shadow:0 6px 0 #9b1c22}
.btn.w{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .6s linear;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.note{font-size:.82rem;color:var(--mut);background:rgba(79,124,255,.08);border:1px dashed rgba(79,124,255,.4);border-radius:12px;padding:10px 12px;margin-top:12px}
.err{color:#ff7b7b;font-size:.9rem;min-height:1.4em;margin:6px 0}
.chk{display:flex;align-items:center;gap:8px;font-size:.92rem;color:var(--mut);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--gold)}
/* shell */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:rgba(18,25,51,.92);backdrop-filter:blur(10px);border-left:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 16px;font-weight:900;font-size:1.25rem}
.mini-flag{width:30px;height:20px;border-radius:5px;background:linear-gradient(#111 33%,var(--red) 33% 66%,var(--gold) 66%)}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--mut);font-weight:600;transition:.2s;text-align:right;width:100%}
.nav:hover{background:var(--card);color:var(--txt);transform:translateX(-3px)}
.nav.on{background:linear-gradient(90deg,rgba(255,204,0,.05),rgba(255,204,0,.18));color:var(--gold);box-shadow:inset -3px 0 0 var(--gold)}
.nav .ic{font-size:1.25rem;width:26px;text-align:center}
.nav .bd{margin-right:auto;background:var(--red);color:#fff;font-size:.72rem;border-radius:9px;padding:0 7px}
.main{padding:22px 30px 90px;max-width:1150px;width:100%;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.top h2{font-size:1.6rem;font-weight:900;margin-left:auto}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);padding:6px 14px;border-radius:99px;font-weight:700}
.pill.f{color:#ff9d3c}.pill.x{color:var(--gold)}
.view{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;transition:transform .25s,box-shadow .25s,border-color .25s;position:relative;overflow:hidden}
.card.h:hover{transform:translateY(-5px);box-shadow:var(--sh);border-color:rgba(255,204,0,.5);cursor:pointer}
.card h3{font-size:1.15rem;margin-bottom:6px}
.mut{color:var(--mut)}.sm{font-size:.86rem}
.big-ic{font-size:2.3rem;display:block;margin-bottom:6px;transition:transform .3s}
.card.h:hover .big-ic{transform:scale(1.2) rotate(-8deg)}
.hero{background:linear-gradient(135deg,#232e63,#3a1f4f 60%,#4d1f2a);border:none;padding:26px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.1) 0);display:grid;place-items:center;flex-shrink:0;transition:--p 1s}
.ring>div{width:96px;height:96px;border-radius:50%;background:#28214a;display:grid;place-items:center;text-align:center;font-weight:900;line-height:1.2}
.bar{height:12px;background:rgba(255,255,255,.08);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#7cf0a6);border-radius:9px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.tag{display:inline-block;font-size:.75rem;padding:2px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-weight:700}
.lv-A1{--c:#22c55e}.lv-A2{--c:#4f7cff}.lv-B1{--c:#9b5cff}.lv-B2{--c:#ff8a3d}.lv-C1{--c:#e8333a}
.say{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--blue);color:#fff;font-size:1rem;transition:.2s;flex-shrink:0;vertical-align:middle}
.say:hover{transform:scale(1.12)}.say.playing{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,124,255,.7)}100%{box-shadow:0 0 0 14px rgba(79,124,255,0)}}
/* path */
.lvtabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.lvtab{padding:10px 18px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-weight:800;font-family:Inter;transition:.2s}
.lvtab.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--card));color:#fff}
.lvtab.lock{opacity:.5}
.path{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0}
.node-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;animation:pop .5s backwards}
.node{width:86px;height:86px;border-radius:50%;font-size:2.1rem;display:grid;place-items:center;background:var(--c,#555);box-shadow:0 8px 0 rgba(0,0,0,.35),inset 0 -6px 0 rgba(0,0,0,.2);transition:.2s;position:relative}
.node:hover{transform:translateY(-4px) scale(1.05)}
.node.locked{background:#3a4166;filter:grayscale(1);cursor:not-allowed}
.node.cur{animation:bob 1.6s ease-in-out infinite}
.node.cur::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--c);animation:pulse2 1.6s infinite}
@keyframes pulse2{from{opacity:1;transform:scale(.9)}to{opacity:0;transform:scale(1.3)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.node .stars{position:absolute;bottom:-12px;font-size:.8rem;background:var(--bg);padding:0 6px;border-radius:9px}
.node-lbl{font-weight:700;font-size:.95rem;text-align:center;max-width:180px}
.conn{width:6px;height:30px;border-radius:4px;background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 12px)}
/* exercise */
.ex{max-width:720px;margin:0 auto}
.ex-top{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.ex-top .bar{flex:1;height:16px}
.x{font-size:1.4rem;color:var(--mut);padding:4px 10px}
.q{font-size:1.45rem;font-weight:800;margin-bottom:6px}
.qsub{color:var(--mut);margin-bottom:20px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:16px;font-size:1.1rem;font-weight:700;transition:.15s;text-align:center}
.opt:hover{border-color:var(--blue);transform:translateY(-2px)}
.opt.sel{border-color:var(--blue);background:rgba(79,124,255,.15)}
.opt.ok{border-color:var(--green);background:rgba(34,197,94,.18);animation:okp .4s}
.opt.no{border-color:var(--red);background:rgba(232,51,58,.18);animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes okp{50%{transform:scale(1.06)}}
.tokens{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr}
.answer-line{min-height:64px;border-bottom:2px solid var(--line);margin-bottom:22px;padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;direction:ltr}
.tok{background:var(--card2);border:2px solid var(--line);border-bottom-width:4px;padding:8px 14px;border-radius:12px;font-family:Inter;font-weight:600;font-size:1.05rem;transition:.15s;animation:pop .25s}
.tok:hover{border-color:var(--gold)}
.tok.used{visibility:hidden}
.fb{position:fixed;bottom:0;left:0;right:0;padding:18px 30px;z-index:30;transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;gap:16px;justify-content:center;flex-wrap:wrap}
.fb.show{transform:none}
.fb.ok{background:#0f3a22;border-top:3px solid var(--green)}
.fb.no{background:#3d1416;border-top:3px solid var(--red)}
.fb .msg{font-weight:800;font-size:1.15rem;max-width:560px}
.learn-card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:26px;padding:34px;text-align:center;box-shadow:var(--sh);animation:flipIn .55s}
@keyframes flipIn{from{transform:perspective(800px) rotateY(-70deg);opacity:0}to{transform:none;opacity:1}}
.learn-card .w{font-size:2.6rem;font-weight:800}
/* flashcards */
.fc{perspective:1000px;height:280px;max-width:520px;margin:0 auto 20px;cursor:pointer}
.fc-in{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;border:1px solid var(--line)}
.fc-f{background:linear-gradient(150deg,#26336e,#1b2350)}
.fc-b{background:linear-gradient(150deg,#3a2350,#24183a);transform:rotateY(180deg)}
/* games */
.arena{position:relative;height:440px;background:linear-gradient(#141c3c,#0d1328);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.drop{position:absolute;padding:8px 14px;border-radius:12px;background:var(--card2);border:2px solid var(--blue);font-family:Inter;font-weight:700;white-space:nowrap;cursor:pointer;user-select:none;transition:background .2s}
.drop:hover{background:var(--blue)}
.drop.boom{animation:boom .35s forwards}
@keyframes boom{to{transform:scale(1.8);opacity:0}}
.ground{position:absolute;bottom:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--red),var(--gold))}
.hud{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:640px;margin:0 auto}
.mc{aspect-ratio:1/0.8;perspective:600px;cursor:pointer}
.mc-in{width:100%;height:100%;position:relative;transition:transform .45s;transform-style:preserve-3d}
.mc.open .mc-in,.mc.done .mc-in{transform:rotateY(180deg)}
.mc-f,.mc-b{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;display:grid;place-items:center;padding:6px;text-align:center;font-weight:700}
.mc-f{background:linear-gradient(135deg,var(--red),var(--gold));font-size:1.8rem}
.mc-b{background:var(--card2);border:2px solid var(--line);transform:rotateY(180deg);font-size:.95rem}
.mc.done .mc-b{border-color:var(--green);background:rgba(34,197,94,.2)}
.art-btns{display:flex;gap:14px;justify-content:center;margin-top:24px}
.art{width:120px;padding:18px;border-radius:18px;font-family:Inter;font-weight:800;font-size:1.4rem;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.35);transition:.12s}
.art:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.art.der{background:#2f6bff}.art.die{background:#e8335f}.art.das{background:#20b26b}
.combo{font-weight:900;color:var(--gold);font-size:1.3rem;animation:okp .3s}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(5,8,20,.7);backdrop-filter:blur(6px);z-index:60;display:grid;place-items:center;animation:fade .25s;padding:20px}
@keyframes fade{from{opacity:0}}
.modal{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:30px;max-width:460px;width:100%;text-align:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.modal .em{font-size:4.2rem;display:block;animation:bob 1.5s infinite}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
.xp-pop{position:fixed;z-index:90;font-weight:900;font-size:1.6rem;color:var(--gold);pointer-events:none;animation:xpu 1.2s forwards;text-shadow:0 3px 10px rgba(0,0,0,.5)}
@keyframes xpu{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:translateY(-80px)}}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--gold);padding:10px 20px;border-radius:14px;z-index:95;animation:pop .3s;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--mut);font-weight:600}
.badge{text-align:center;padding:16px 10px;border-radius:16px;background:var(--card);border:1px solid var(--line);transition:.25s}
.badge .bi{font-size:2.3rem;display:block}
.badge.lock{opacity:.35;filter:grayscale(1)}
.badge:not(.lock):hover{transform:rotate(-3deg) scale(1.05)}
.rank-row{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:10px}
.rank-row.me{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,204,0,.15)}
.rank-row .ri{font-size:2rem}
.ch{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--txt)}
.av{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-weight:900;font-family:Inter;font-size:1.3rem;color:#fff;flex-shrink:0;position:relative}
.av::after{content:'▶';position:absolute;bottom:-6px;left:-6px;background:#ff0033;width:24px;height:24px;border-radius:50%;font-size:.6rem;display:grid;place-items:center;border:2px solid var(--card)}
.sound{display:flex;gap:12px;align-items:flex-start}
.sound .L{font-family:Inter;font-weight:800;font-size:1.8rem;color:var(--gold);min-width:64px;text-align:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:4px 10px;margin:3px;cursor:pointer;font-family:Inter;transition:.15s}
.chip:hover{border-color:var(--blue);background:rgba(79,124,255,.15)}
.umlauts{display:flex;gap:6px;justify-content:center;margin:10px 0;direction:ltr}
.umlauts button{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-family:Inter;font-weight:700}
.sec-title{font-size:1.2rem;font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.tf{display:flex;gap:8px}
.tf button{padding:8px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--card2);font-family:Inter;font-weight:700}
.tf button.sel{background:var(--blue);border-color:var(--blue)}
.ann{background:linear-gradient(90deg,rgba(255,204,0,.15),rgba(232,51,58,.12));border:1px solid rgba(255,204,0,.4);border-radius:14px;padding:12px 16px;margin-bottom:16px;display:flex;gap:10px;align-items:center}
.owner-card{background:linear-gradient(135deg,#3b2a00,#5a1d1d);border:1px solid var(--gold);text-align:center}
.crown{font-size:3rem;display:block;animation:bob 2s infinite}
.footer{text-align:center;color:var(--mut);font-size:.82rem;margin-top:40px;padding-top:16px;border-top:1px solid var(--line)}
.mobnav{display:none}
@media(max-width:900px){
  .auth-wrap{grid-template-columns:1fr}.auth-hero{padding:30px 22px 0}.auth-hero h1{font-size:1.9rem}
  .shell{grid-template-columns:1fr}.side{display:none}

function similarity(a,b){a=norm(a);b=norm(b);const m=a.length,n=b.length;if(!m||!n)return 0;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return Math.round(100*(1-d[m][n]/Math.max(m,n)))}

const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],cfRun=false;
function confetti(n=140){cv.width=innerWidth;cv.height=innerHeight;const cols=['#ffcc00','#e8333a','#22c55e','#4f7cff','#9b5cff','#fff'];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,s:Math.random()*8+4,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.3,l:120});
  if(!cfRun){cfRun=true;requestAnimationFrame(cfLoop)}}
function cfLoop(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.vx*=.99;p.r+=p.vr;p.l--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});

      let ok=norm(sel)===norm(e.a);if(!ok&&e.type==='type'){const a=norm(e.a).replace(/^(der|die|das) /,'');if(norm(sel)===a)ok='art'}

  <div class="sec-title">➕ إضافة كلمات للمنهج</div><div class="card"><div class="grid g4" style="gap:10px"><input id="cw1" dir="ltr" placeholder="die Steckdose"><input id="cw2" placeholder="المقبس"><input id="cw3" dir="ltr" placeholder="Beispielsatz (اختياري)"><select id="cw4">${LEVELS.map(l=>`<option>${l}</option>`).join('')}</select></div><button class="btn p" style="margin-top:10px" onclick="addCW()">إضافة</button>
   <div style="margin-top:10px">${(DB.customWords||[]).map((c,i)=>`<span class="chip"><span class="tag">${c.L}</span> <span class="de">${esc(c.de)}</span> = ${esc(c.ar)} <b onclick="DB.customWords.splice(${i},1);saveDB();owner()" style="color:var(--red)">✕</b></span>`).join('')||'<span class="mut sm">الكلمات المضافة تظهر كوحدة "كلمات من المالك" في المسار وفي الألعاب.</span>'}</div></div>
  <div class="sec-title">📱 تأكيد الدخول بالواتساب — هل هو مجاني؟</div><div class="card"><p class="sm" style="line-height:2">
   <b>الخلاصة: لا يوجد حل مجاني بالكامل وموثوق.</b> إرسال رمز تحقق (OTP) عبر واتساب يحتاج <b>WhatsApp Business Cloud API</b> من Meta: تحتاج حساب Meta Business موثّق ورقم هاتف مخصص وقالب رسالة من نوع Authentication، وMeta تحاسب على كل رسالة تحقق (السعر يختلف حسب الدولة). كذلك يحتاج خادم (Backend) يحفظ المفتاح السري ولا يمكن وضعه داخل صفحة HTML.<br>
   ✅ <b>بدائل مجانية:</b> ① تسجيل الدخول بالبريد + رابط تأكيد عبر <b>Firebase Authentication</b> أو <b>Supabase Auth</b> (مجاني ضمن حدود كبيرة) ② تسجيل الدخول بحساب Google (مجاني). <br>
   📌 الموقع الآن يحفظ رقم الواتساب لكل مستخدم، فعندما تقرر تفعيل الخدمة يكون الرقم جاهزاً.</p></div>
  <div class="sec-title">🚀 كيف تنشر الموقع على الإنترنت مجاناً</div><div class="card"><ol class="sm" style="padding-right:20px;line-height:2.1"><li>احفظ ملف <span class="de">index.html</span> على جهازك.</li><li>ادخل <a href="https://app.netlify.com/drop" target="_blank" rel="noopener">Netlify Drop</a> واسحب الملف — يصير عندك رابط خلال دقيقة. أو استخدم <a href="https://pages.github.com" target="_blank" rel="noopener">GitHub Pages</a>.</li><li>للمايكروفون (التعرف على النطق) افتح الموقع المنشور من Chrome.</li><li>لحسابات مشتركة بين الأجهزة: اربط Firebase أو Supabase (أقدر أساعدك بهالخطوة).</li></ol></div>
  <div class="sec-title">💾 نسخة احتياطية</div><div class="card"><button class="btn s" onclick="cpBackup()">📋 نسخ بيانات الموقع (JSON)</button><span class="sm mut"> — احفظها بملف عندك</span></div>`}
function addCW(){const de=$('#cw1').value.trim(),ar=$('#cw2').value.trim();if(!de||!ar){toast('اكتب الكلمة ومعناها');return}DB.customWords=DB.customWords||[];DB.customWords.push({de,ar,ex:$('#cw3').value.trim(),L:$('#cw4').value});saveDB();toast('✅ أضيفت');owner()}
function delUser(em){const m=modal(`<span class="em">🗑️</span><h3>حذف ${esc(em)}؟</h3><br><div class="row" style="justify-content:center"><button class="btn s" data-close>إلغاء</button><button class="btn r" id="yy">حذف</button></div>`);m.querySelector('#yy').onclick=()=>{delete DB.users[em];saveDB();m.remove();owner()}}
function cpBackup(){const d=JSON.parse(JSON.stringify(DB));Object.values(d.users).forEach(u=>delete u.pass);navigator.clipboard.writeText(JSON.stringify(d,null,1)).then(()=>toast('✅ تم النسخ (بدون كلمات المرور)'),()=>toast('تعذّر النسخ'))}

/* ===================== BOOT ===================== */
setTimeout(()=>{$('#splash').classList.add('hide');setTimeout(()=>$('#splash').remove(),700);
  const s=store.get('sw_session',null)||sstore.get('sw_session');if(s&&DB.users[s]){ME=s;shell();go(location.hash.slice(1)||'home')}else authView()},1500);
</script>
</body>
</html>
